[package]
name = "unfmt"
version = "0.3.4"
edition = "2021"
rust-version = "1.81"
description = "A compile-time pattern matching library that reverses the interpolation process of `format!`."
repository = "https://github.com/mathematic-inc/unfmt"
license = "Apache-2.0"
keywords = ["format", "no-std", "parsing", "pattern-matching", "unformat"]
categories = ["no-std", "parsing"]

[lib]
path = "./unfmt.rs"

[dependencies]
bstr = "1.13.1"
unfmt_macros = { path = "unfmt_macros", version = "0.3.4" }

[lints]
workspace = true

[workspace]
members = ["unfmt_macros"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_pub_crate = "allow"

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
