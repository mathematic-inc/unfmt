name: Restrict pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      ${{
        !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
        !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Close outside pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh pr close "$PR_NUMBER" --repo "$GH_REPO" --comment
          "Thanks for the proposal. This repository uses a discussion-first contribution process.
          Please open a Discussion instead: https://github.com/$GH_REPO/discussions/new"
